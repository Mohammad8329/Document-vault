type Collection {
  id: ID!
  name: String!
  slug: String!
  createdAt: String!
}

type Document {
  id: ID!
  title: String!
  content: String!
  tags: [String!]!
  isArchived: Boolean!
  createdAt: String!
  updatedAt: String!
  collectionId: ID!
}

# Cursor-based pagination envelope
type DocumentConnection {
  edges: [DocumentEdge!]!
  pageInfo: PageInfo!
}

type DocumentEdge {
  node: Document!
  cursor: String!
}

type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

type Query {
  collections: [Collection!]!
  # Returns null if the collection is not found
  collection(id: ID!): Collection
  
  # Search (title/content), filter (isArchived), and cursor paginate
  documents(
    collectionId: ID
    search: String
    isArchived: Boolean
    take: Int
    after: String
  ): DocumentConnection!
}

type Mutation {
  createCollection(name: String!, slug: String!): Collection!
  createDocument(collectionId: ID!, title: String!, content: String!, tags: [String!]): Document!
  updateDocument(id: ID!, title: String, content: String, tags: [String!], isArchived: Boolean): Document!
  deleteDocument(id: ID!): Boolean!
  moveDocument(id: ID!, collectionId: ID!): Document!
}
