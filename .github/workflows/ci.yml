name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint, Typecheck, and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: vault
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bunx prisma generate

      - name: Apply Database Migrations
        run: bunx prisma migrate deploy
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/vault?schema=public"

      - name: Run Sanity Check (Lint, Typecheck, Unit Tests)
        run: bun run sanity
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/vault?schema=public"
